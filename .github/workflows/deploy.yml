name: Test and Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tts-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-deploy:
    name: Test and deploy tts.gaoyuze.com
    runs-on: [self-hosted, tts, tts-container]
    timeout-minutes: 30
    env:
      REPO_DIR: /home/mgacai/projects/notion-mcp-terminal/TTS
      IMAGE: deploygrow-tts:latest
      CANDIDATE: deploygrow-tts:candidate
      PREV_IMAGE: deploygrow-tts:prev-deploy
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
        working-directory: /home/mgacai/projects/notion-mcp-terminal/TTS
    steps:
      - name: Set up git helper (runs git as repo owner)
        run: |
          OWNER_UID=$(stat -c %u "$REPO_DIR"); OWNER_GID=$(stat -c %g "$REPO_DIR")
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          cat > "$RUNNER_TEMP/g" <<SH
          #!/bin/bash
          # Run git as the repo owner so .git never becomes root-owned
          exec setpriv --reuid=$OWNER_UID --regid=$OWNER_GID --clear-groups env HOME=/tmp GIT_TERMINAL_PROMPT=0 git -C "$REPO_DIR" -c credential.helper= -c "http.https://github.com/.extraheader=AUTHORIZATION: basic \$GIT_AUTH" "\$@"
          SH
          chmod 755 "$RUNNER_TEMP/g"
          echo "GIT_AUTH=$AUTH" >> "$GITHUB_ENV"

      - name: Guard - abort if tracked files have uncommitted changes
        run: |
          DIRTY=$("$RUNNER_TEMP/g" status --porcelain --untracked-files=no)
          if [ -n "$DIRTY" ]; then
            echo "::error::Tracked uncommitted changes in $REPO_DIR; refusing to deploy:"
            echo "$DIRTY"
            exit 1
          fi

      - name: Record previous commit and image
        run: |
          PREV=$("$RUNNER_TEMP/g" rev-parse HEAD)
          echo "PREV=$PREV" >> "$GITHUB_ENV"
          echo "Previous commit: $PREV"
          docker tag "$IMAGE" "$PREV_IMAGE"

      - name: Update code to origin/main
        run: |
          "$RUNNER_TEMP/g" fetch origin main
          "$RUNNER_TEMP/g" reset --hard origin/main
          echo "Now at: $("$RUNNER_TEMP/g" rev-parse HEAD)"

      - name: Build candidate image
        run: |
          # Build exactly the commit being released, excluding unrelated untracked work in the shared checkout.
          if ! "$RUNNER_TEMP/g" archive HEAD | docker build -t "$CANDIDATE" -; then
            echo "::error::Image build failed; restoring code to $PREV (live container untouched)"
            "$RUNNER_TEMP/g" reset --hard "$PREV"
            exit 1
          fi

      - name: Run unit tests in the candidate image (throwaway container)
        run: |
          # The exact dependencies about to ship, against the new code (tests are not baked into the image).
          # Some tests inspect web/dist when that gitignored folder exists. The shared checkout can
          # retain a stale dist from a previous release, so overlay the SPA baked into the candidate
          # (/app/static/app) instead of trusting the host leftover.
          DIST="$RUNNER_TEMP/candidate-web-dist"
          rm -rf "$DIST"
          mkdir -p "$DIST"
          if ! docker run --rm --entrypoint tar "$CANDIDATE" -C /app/static/app -cf - . | tar -C "$DIST" -xf -; then
            echo "::error::Could not read the candidate SPA; restoring code to $PREV (live container untouched)"
            "$RUNNER_TEMP/g" reset --hard "$PREV"
            exit 1
          fi
          if ! docker run --rm -v "$REPO_DIR":/src -v "$DIST":/src/web/dist:ro -w /src --user "$(stat -c %u:%g "$REPO_DIR")" \
               -e PYTHONDONTWRITEBYTECODE=1 --entrypoint python "$CANDIDATE" -m unittest discover -s tests; then
            echo "::error::Tests failed; restoring code to $PREV (live container untouched)"
            "$RUNNER_TEMP/g" reset --hard "$PREV"
            exit 1
          fi

      - name: Back up the database
        run: |
          # SQLite online backup into outputs/backups/ (newest 14 kept); no release without one
          if ! docker run --rm -v "$REPO_DIR/outputs":/app/outputs -e OUTPUT_DIR=/app/outputs \
               --entrypoint python "$CANDIDATE" scripts/backup_db.py --label "$("$RUNNER_TEMP/g" rev-parse --short=12 HEAD)"; then
            echo "::error::Database backup failed; restoring code to $PREV (live container untouched)"
            "$RUNNER_TEMP/g" reset --hard "$PREV"
            exit 1
          fi

      - name: Restart production container on the candidate image
        run: |
          docker tag "$CANDIDATE" "$IMAGE"
          if ! docker compose up -d --no-build; then
            echo "::error::Restart failed; rolling back"
            "$RUNNER_TEMP/g" reset --hard "$PREV"
            docker tag "$PREV_IMAGE" "$IMAGE"
            docker compose up -d --no-build
            exit 1
          fi

      - name: Health check (rollback on failure)
        run: |
          ok=0
          for i in $(seq 1 30); do
            h=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8000/healthz || true)
            a=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8000/app/study || true)
            b=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 https://tts.gaoyuze.com/app/study || true)
            echo "attempt $i: healthz=$h local=$a public=$b"
            if [ "$h" = 200 ] && [ "$a" = 200 ] && [ "$b" = 200 ]; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Health check failed; rolling back to $PREV"
            "$RUNNER_TEMP/g" reset --hard "$PREV"
            docker tag "$PREV_IMAGE" "$IMAGE"
            docker compose up -d --no-build
            exit 1
          fi
          echo "Deployed $("$RUNNER_TEMP/g" rev-parse HEAD)"
