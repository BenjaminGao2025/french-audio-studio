services:
  tts-service:
    build: .
    image: deploygrow-tts:latest
    container_name: tts-service
    network_mode: host
    restart: unless-stopped
    env_file: .env
    environment:
      OUTPUT_DIR: /app/outputs
      PERPLEXITY_BASE_URL: http://127.0.0.1:8002/v1
      AGY_BASE_URL: http://127.0.0.1:8645/v1
      PERPLEXITY_MODEL: gpt-6.1-sol-thinking
      PERPLEXITY_PROOFREAD_MODEL: gemini-3.8-flash
      FAST_MODEL: gemini-3.8-flash
      PERPLEXITY_TIMEOUT_SECONDS: "120"
      MAX_TEXT_CHARS: "15000"
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models:ro
