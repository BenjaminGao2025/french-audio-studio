<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>法语拆解与跟读复述 - 1000H French</title>
    <link rel="icon" href="/favicon.ico?v=2" sizes="any">
    <link rel="stylesheet" href="/static/style.css?v=5.0">
    <link rel="stylesheet" href="/static/study.css?v=5.0">
    <script src="https://unpkg.com/lucide@1.34.0/dist/umd/lucide.min.js" defer></script>
    <script src="/static/study.js?v=5.0" defer></script>
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="brand-block">
                <div class="brand-mark" aria-hidden="true">
                    <i data-lucide="book-open"></i>
                </div>
                <div>
                    <p class="product-label">1000H French</p>
                    <h1>法语拆解与跟读复述</h1>
                </div>
            </div>

            <nav class="nav-tabs" aria-label="页面切换">
                <a href="/" class="nav-tab">
                    <i data-lucide="headphones" aria-hidden="true"></i>
                    <span>音频工作台</span>
                </a>
                <a href="/study" class="nav-tab active" aria-current="page">
                    <i data-lucide="sparkles" aria-hidden="true"></i>
                    <span>拆解与复述</span>
                </a>
            </nav>

            <details class="connection-settings">
                <summary>
                    <i data-lucide="key-round" aria-hidden="true"></i>
                    <span class="summary-label">连接设置</span>
                    <span id="connection-summary-state" class="connection-summary-state" data-state="idle" title="连接尚未验证">
                        <span class="connection-dot" aria-hidden="true"></span>
                        <span class="connection-summary-text">未验证</span>
                    </span>
                    <i data-lucide="chevron-down" class="summary-chevron" aria-hidden="true"></i>
                </summary>
                <form class="connection-popover" autocomplete="off">
                    <div class="connection-field">
                        <label for="api-key">Perplexity web2api API Key</label>
                        <div class="password-row">
                            <input id="api-key" type="password" autocomplete="off" spellcheck="false">
                            <button id="toggle-key" class="icon-btn" type="button" title="显示或隐藏 API Key" aria-label="显示或隐藏 API Key">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="connection-field">
                        <label for="model-select">分析模型</label>
                        <select id="model-select">
                            <option value="grok-4.6" selected>Grok 4.6 · 推荐</option>
                            <option value="grok-4.6-thinking">Grok 4.6 Thinking</option>
                            <option value="sonar-2">Sonar 2 · 备用</option>
                        </select>
                    </div>
                    <label class="check-row" for="remember-key">
                        <input id="remember-key" type="checkbox">
                        <span>记住在此设备</span>
                    </label>
                    <div class="connection-test-row">
                        <div id="connection-result" class="connection-result" data-state="idle" role="status" aria-live="polite">
                            <span class="connection-dot" aria-hidden="true"></span>
                            <div>
                                <strong id="connection-result-title">尚未测试</strong>
                                <span id="connection-result-detail">填写 Key 后测试实际连接</span>
                            </div>
                        </div>
                        <button id="test-connection" class="btn btn-test" type="button">
                            <i data-lucide="plug-zap" aria-hidden="true"></i>
                            <span>测试连接</span>
                        </button>
                    </div>
                </form>
            </details>
        </header>

        <main>
            <!-- 输入卡片：与工作台卡片规范 100% 同构 -->
            <article class="editor-panel study-input-panel" aria-label="输入法语文本">
                <div class="panel-heading">
                    <div>
                        <span class="step-number">01</span>
                        <h2>输入待拆解与复述的法语文本</h2>
                    </div>
                    <div class="panel-tools">
                        <button id="fill-example-btn" class="btn btn-secondary" type="button" title="填入经典法语示例">
                            <i data-lucide="lightbulb" aria-hidden="true"></i>
                            <span>填入示例</span>
                        </button>
                        <button id="clear-input-btn" class="icon-btn" type="button" title="清空内容" aria-label="清空内容">
                            <i data-lucide="trash-2"></i>
                        </button>
                    </div>
                </div>
                <textarea id="french-input" maxlength="15000" placeholder="粘贴或输入一段法语文本（可包含单句或多句），系统将逐句切分、三列深度解析每个单词/短语并支持语音即时跟读打分..." spellcheck="true"></textarea>
                <div class="editor-footer">
                    <span id="char-counter">0 / 15000</span>
                </div>
            </article>

            <!-- 操作与状态横条 -->
            <section class="action-row" aria-label="拆解操作">
                <div id="study-status-message" class="status-message" role="status" aria-live="polite"></div>
                <div class="action-buttons">
                    <button id="analyze-btn" class="btn btn-primary" type="button">
                        <i data-lucide="sparkles" aria-hidden="true"></i>
                        <span id="analyze-btn-label">开始拆解与精析</span>
                    </button>
                </div>
            </section>

            <!-- 结果与跟读区域 -->
            <section id="study-deck-section" class="study-deck-section" aria-label="解析与跟读卡片" hidden>
                <div class="deck-header">
                    <div class="deck-title-row">
                        <span class="step-number">02</span>
                        <h2>句子精析与发音复述</h2>
                    </div>
                    <span id="sentence-count-badge" class="badge">共 0 句</span>
                </div>

                <div id="sentences-container" class="sentences-container">
                    <!-- 动态注入句子解析与跟读卡片 -->
                </div>
            </section>
        </main>
    </div>
</body>
</html>
