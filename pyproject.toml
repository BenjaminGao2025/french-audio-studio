[project]
name = "french-audio-studio"
version = "2.0.0"
description = "French listening, reading, speaking and writing practice: FastAPI + vanilla JS."
requires-python = ">=3.11"
# Runtime dependencies: requirements.in (direct) and requirements.txt (pinned, uv-compiled).

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["node_modules", "models", "outputs"]

[tool.ruff.lint]
# pyflakes, import order and the syntax/statement pycodestyle checks
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true
